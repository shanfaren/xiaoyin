services:
  - type: web
    name: xiaoyin
    runtime: python
    plan: free
    region: singapore
    buildCommand: "echo no-build-pure-stdlib"
    startCommand: "python -m backend.server"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ARK_API_KEY
        sync: false
      - key: ARK_MODEL
        value: "doubao-seed-evolving"
      - key: ARK_VISION_MODEL
        value: "doubao-seed-evolving"
      - key: TTS_API_KEY
        sync: false
      - key: ASR_PROVIDER
        value: "volcengine"
      - key: ASR_BASE_URL
        value: "https://openspeech.bytedance.com/api/v3/auc/bigmodel"
      - key: ASR_MODEL
        value: "bigmodel"
      - key: ASR_RESOURCE_ID
        value: "volc.seedasr.auc"
      - key: ASR_API_KEY
        sync: false
      - key: STREAMING_ASR_ENABLED
        value: "true"
      - key: STREAMING_ASR_BASE_URL
        value: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel"
      - key: STREAMING_ASR_RESOURCE_ID
        value: "volc.seedasr.sauc.duration"
