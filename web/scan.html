<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码进入探究 · 森林小博士</title>
<style>
  :root{
    --forest-900:#1d3b28; --forest-700:#2f6b3f; --forest-500:#4a8f56;
    --leaf-200:#d7e9cf; --cream:#fbf7ec; --sun:#f2c14e; --ink:#1c2a1e; --ink-soft:#4a5c4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(900px 420px at 50% -6%, #eaf5e2 0%, rgba(234,245,226,0) 62%),
      linear-gradient(180deg,#f4f9ef, var(--cream));
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--ink); display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .card{
    background:#fff; border-radius:26px; box-shadow:0 18px 44px rgba(29,59,40,.16);
    border:1px solid var(--leaf-200); padding:26px 30px 24px; max-width:820px; width:100%;
    display:grid; grid-template-columns:1fr auto; gap:26px; align-items:center;
  }
  .left{min-width:0;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .brand svg{width:62px;height:62px;flex:0 0 auto;}
  .title{font-size:34px;font-weight:900;color:var(--forest-900);line-height:1.2;}
  .sub{font-size:16px;color:var(--ink-soft);margin-top:2px;}
  h2{font-size:26px;margin:14px 0 8px;color:var(--forest-700);}
  ol{margin:0;padding-left:1.35em;font-size:18px;line-height:1.85;}
  .hint{
    margin-top:14px;font-size:15px;color:#7a5a12;background:#fdf3d8;border:1px solid #f0dca6;
    border-radius:12px;padding:10px 13px;line-height:1.6;
  }
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .qrbox img{width:280px;height:280px;border-radius:16px;border:1px solid var(--leaf-200);background:#fff;}
  .qr-url{font-size:13px;color:var(--ink-soft);max-width:280px;word-break:break-all;text-align:center;font-family:ui-monospace,Consolas,monospace;}
  .badge{font-size:13px;font-weight:800;color:var(--forest-700);background:var(--leaf-200);border-radius:999px;padding:4px 12px;}
  .tools{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:15px;font-weight:800;border-radius:12px;cursor:pointer;
    padding:9px 16px;border:1.5px solid var(--leaf-200);background:var(--cream);color:var(--forest-700);
  }
  button.primary{background:var(--forest-700);color:#fff;border-color:var(--forest-700);}
  @media (max-width:720px){
    .card{grid-template-columns:1fr;}
    .qrbox{order:-1;}
    .qrbox img{width:230px;height:230px;}
    .title{font-size:26px;}
  }
  @media print{
    body{background:#fff;}
    .card{box-shadow:none;border:none;}
    .tools{display:none;}
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="qg" cx="50%" cy="32%" r="72%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#EFE6D2"/>
          </radialGradient>
          <filter id="qf" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M50 13 C61 4, 75 6, 79 12 C75 21, 60 23, 50 19 Z" fill="#4A8F56"/>
        <path d="M51 18 C59 14, 70 12, 79 12" stroke="#2F6B3F" stroke-width="1.6" fill="none"/>
        <path d="M53 17 L53 11" stroke="#2F6B3F" stroke-width="2.6" stroke-linecap="round"/>
        <rect x="14" y="20" width="72" height="66" rx="24" fill="#2F6B3F"/>
        <rect x="19" y="25" width="62" height="56" rx="20" fill="url(#qg)" stroke="#8FBF8A" stroke-width="1.2"/>
        <rect x="26" y="36" width="48" height="30" rx="14" fill="#1D3B28" opacity="0.92"/>
        <circle cx="40" cy="51" r="6.4" fill="#F2C14E" filter="url(#qf)"/>
        <circle cx="60" cy="51" r="6.4" fill="#F2C14E" filter="url(#qf)"/>
        <circle cx="42" cy="49" r="2" fill="#FFFDF3"/><circle cx="62" cy="49" r="2" fill="#FFFDF3"/>
        <circle cx="79" cy="70" r="9" fill="none" stroke="#C8552F" stroke-width="3.2"/>
        <path d="M85.5 76.5 L92 84" stroke="#C8552F" stroke-width="4.6" stroke-linecap="round"/>
        <circle cx="79" cy="70" r="5" fill="#D7E9CF" opacity="0.85"/>
      </svg>
      <div>
        <div class="title">找一找，谁在隐身？</div>
        <div class="sub">森林小博士 · 自然探究 AI 伙伴 ｜ 幼儿园大班科学</div>
      </div>
    </div>
    <h2>用平板或手机扫一扫</h2>
    <ol>
      <li>打开平板或手机的相机，对准右边的二维码</li>
      <li>点一下弹出的链接，就能和森林小博士说话啦</li>
      <li>先看一看，再猜一猜，然后告诉森林小博士你的发现</li>
    </ol>
    <div class="hint" id="hint">正在获取扫码地址…</div>
    <div class="tools">
      <button class="primary" onclick="window.print()">打印这一页</button>
      <button onclick="location.reload()">重新获取地址</button>
      <button onclick="openFull()">放大二维码</button>
    </div>
  </div>
  <div class="qrbox">
    <div class="badge" id="modeBadge">同 Wi-Fi 局域网</div>
    <img id="qr" alt="扫码进入探究" src="/api/qrcode.png?scale=12">
    <div class="qr-url" id="urlText"></div>
  </div>
</div>
<script>
function openFull(){
  var w = window.open('', '_blank');
  if(!w) return;
  w.document.write('<title>二维码</title><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#fff">'
    + '<img src="/api/qrcode.png?scale=20" style="width:min(92vw,92vh)">');
}
fetch('/api/access-info').then(function(r){return r.json();}).then(function(j){
  document.getElementById('urlText').textContent = j.recommended_url || '（未获取到地址）';
  document.getElementById('modeBadge').textContent = (j.mode === 'public' ? '公网 HTTPS 地址' : '同 Wi-Fi 局域网');
  var h = document.getElementById('hint');
  if (j.mode === 'public'){
    h.textContent = '当前二维码指向公网正式地址：' + j.recommended_url + '。请确认该地址可在学生手机上正常打开。';
  } else {
    h.textContent = '当前二维码指向局域网地址：' + j.recommended_url
      + '。手机需要和老师电脑连在同一个 Wi-Fi 上；如果打不开，可能是路由器开启了「设备隔离」或使用了校园网。';
  }
}).catch(function(){
  document.getElementById('hint').textContent = '没有获取到地址，请确认服务已启动。';
});
</script>
</body>
</html>
