<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>森林小博士模型动作检查</title>
<style>body{margin:0;background:#fffaf2;font:16px sans-serif}#stage{height:86vh}nav{position:absolute;top:10px;left:10px;z-index:2}button{padding:12px;margin:4px}#info{position:absolute;bottom:5px;left:12px}</style>
<nav><button id="full">全身</button><button id="face">脸部</button><button id="back">背面</button><button id="pose">说话动作</button><button id="rest">静止</button><button id="sample">统一男声试听</button><button id="skeleton">骨骼检查</button><button id="open">最大张口</button></nav><div id="stage"></div><p id="info">正在读取模型</p>
<script src="/static/vendor/three.min.js"></script><script src="/static/vendor/GLTFLoader.js"></script><script src="/static/vendor/meshopt_decoder.js"></script><script src="/static/real-character.js?v=20261016blender1"></script><script>
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,innerWidth/(innerHeight*.86),.01,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight*.86);renderer.setPixelRatio(devicePixelRatio);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.getElementById('stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xaaa999,2.5));var light=new THREE.DirectionalLight(0xfff4df,2);light.position.set(0,5,7);scene.add(light);
var character,mode='idle',facing=0,sample=null,envelope=null,helper=null,fixedLevel=0;window.forestSpeechLevel=()=>sample&&!sample.paused&&envelope?(envelope[Math.floor(sample.currentTime/.02)]||0):mode==='speaking'?(fixedLevel||.65+.35*Math.sin(performance.now()/130)):0;camera.position.set(0,2.1,8);camera.lookAt(0,2,0);
renderer.domElement.onclick=function(e){if(!character)return;var r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/(innerHeight*.86)*2),camera);var hit=r.intersectObject(character.root,true)[0];if(hit)document.getElementById('info').textContent='Surface position: '+hit.point.toArray().map(x=>x.toFixed(4)).join(', ');};
fetch('/assets/models/character.json',{cache:'no-store'}).then(r=>r.json()).then(d=>loadForestCharacter(THREE,d.url)).then(c=>{character=c;scene.add(c.root);document.getElementById('info').textContent=c.vertices+' vertices; '+c.meshes+' mesh(es)';});
document.getElementById('full').onclick=()=>{camera.position.set(0,2.1,8);camera.lookAt(0,2,0);facing=0;};
document.getElementById('face').onclick=()=>{camera.position.set(0,3.4,2.5);camera.lookAt(0,3.4,0);facing=0;};
document.getElementById('back').onclick=()=>{camera.position.set(0,2.1,8);camera.lookAt(0,2,0);facing=Math.PI;};
document.getElementById('pose').onclick=()=>{fixedLevel=0;mode='speaking';};document.getElementById('rest').onclick=()=>{mode='idle';if(sample)sample.pause();};
document.getElementById('open').onclick=()=>{fixedLevel=1;mode='speaking';};
document.getElementById('skeleton').onclick=()=>{if(!character)return;if(!helper){helper=new THREE.SkeletonHelper(character.root);helper.material.depthTest=false;helper.material.linewidth=3;scene.add(helper);}else helper.visible=!helper.visible;};
document.getElementById('sample').onclick=async()=>{if(sample)sample.pause();sample=new Audio('/assets/audio/'+encodeURIComponent('森林小博士_统一标准试听.mp3'));sample.onended=()=>mode='idle';mode='speaking';sample.play();const bytes=await fetch(sample.src).then(r=>r.arrayBuffer());const c=new OfflineAudioContext(1,1,16000),a=await c.decodeAudioData(bytes),data=a.getChannelData(0),hop=Math.round(a.sampleRate*.02);envelope=new Float32Array(Math.ceil(data.length/hop));let peak=.01;for(let i=0;i<envelope.length;i++){let sum=0,n=0;for(let j=i*hop;j<Math.min(data.length,(i+1)*hop);j++){sum+=data[j]*data[j];n++;}envelope[i]=Math.sqrt(sum/n);peak=Math.max(peak,envelope[i]);}for(let i=0;i<envelope.length;i++)envelope[i]=envelope[i]<.008?0:Math.min(1,Math.pow(envelope[i]/peak,.6));};
function draw(t){requestAnimationFrame(draw);if(character){character.root.rotation.y=facing;character.update(mode,t/1000,false);}renderer.render(scene,camera);}requestAnimationFrame(draw);
</script></html>
