<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>森林小博士 · 云端版</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css?v=20261015touch3">
<link rel="stylesheet" href="/static/chat.css?v=20261015compact1">
<link rel="stylesheet" href="/static/companion.css?v=20261025illustrated2">
</head>
<body class="chat-surface">
<div id="app" class="app">

  <!-- 顶部：角色与身份 -->
  <header class="topbar">
    <div class="brand">
      <div class="avatar" id="brandAvatar" aria-hidden="true">
        <img src="/assets/avatar/forest-official.png?v=20261015official1" alt="森林小博士" id="brandAvatarImg" width="44" height="44">
      </div>
      <div class="brand-text">
        <div class="brand-name"><span id="charName">森林小博士</span><span class="ai-tag">AI 伙伴</span></div>
        <div class="brand-sub" id="brandSub">自然探究 AI 伙伴 · 大班科学</div>
      </div>
    </div>
    <button class="icon-btn" id="btnNew" title="开始新对话" aria-label="开始新对话">↺</button>
  </header>

  <nav class="view-switch" aria-label="选择显示方式">
    <button type="button" id="view3d" aria-pressed="false">角色对话</button>
    <button type="button" id="viewChat" aria-pressed="true">文字聊天</button>
  </nav>
  <section id="companion" class="companion" hidden aria-label="森林小博士形象语音伙伴">
    <div class="companion-cloud"><p class="companion-caption" id="companionCaption" aria-live="polite">你好呀，我们一起寻找大自然的隐身高手吧！</p></div>
    <button type="button" class="character-stage" id="characterStage" aria-label="轻点森林小博士开始或停止说话"><span id="modelLoading">正在加载 2D 角色…</span></button>
    <div class="companion-bottom">
      <p class="companion-state" id="companionState" role="status">点击我，说说你的发现</p>
      <div class="companion-actions"><button type="button" id="companionTalk">按住说话</button><button type="button" id="companionReplay" hidden>重新朗读</button><button type="button" id="companionCancel" hidden>取消录音</button></div>
      <label class="companion-purpose">一起做什么 <select id="companionPurpose" aria-label="选择对话用途"><option value="qa">提问答疑</option><option value="hint">探究提示</option></select></label>
      <p class="companion-note">轻点我，开始或停止说话 · 也可以切换文字聊天</p>
    </div>
  </section>
  <nav class="interaction-tabs" id="interactionTabs" aria-label="选择对话用途">
    <button type="button" data-profile="qa" aria-pressed="true">提问答疑</button>
    <button type="button" data-profile="hint" aria-pressed="false">探究提示</button>
  </nav>
  <p class="interaction-goal" id="interactionGoal">有疑问，听一个简短、准确的解释。</p>

  <!-- 主体 -->
  <main class="main" id="main">
    <!-- 首屏欢迎区 -->
    <section class="welcome" id="welcome">
      <h1 class="welcome-heading">一起发现大自然的秘密</h1>
      <div class="hero">
        <div class="hero-avatar" id="heroAvatar" aria-hidden="true">
          <img src="/assets/avatar/forest-official.png?v=20261015official1" alt="森林小博士" id="heroAvatarImg" width="56" height="56">
        </div>
        <div class="hero-bubble" id="welcomeText">你好呀！我是森林小博士，你的自然探究小伙伴。</div>
      </div>

      <details class="task-card" hidden>
        <summary>今天的探究任务</summary>
        <div class="task-label">今天的探究任务</div>
        <div class="task-title" id="taskTitle">走进神秘的大森林</div>
        <div class="task-goal" id="taskGoal"></div>
        <div class="task-path">
          <span>观察现象</span><i>→</i><span>提出猜想</span><i>→</i><span>寻找证据</span><i>→</i><span>比较解释</span><i>→</i><span>迁移应用</span>
        </div>
      </details>

      <div class="quick">
        <div class="quick-label">你可以这样问我</div>
        <div class="quick-list" id="quickList"></div>
      </div>

      <div class="voice-entry">
        <button class="voice-big" id="btnVoiceBig">
          <span class="mic-dot"></span>按住说话
        </button>
        <div class="voice-hint" id="voiceHint"></div>
      </div>
    </section>

    <!-- 对话区 -->
    <section class="chat" id="chat" hidden></section>
  </main>

  <!-- 状态提示 -->
  <div class="status" id="status" hidden><span class="spinner"></span><span id="statusText"></span></div>

  <!-- 识别结果可编辑区 -->
  <div class="asr-edit" id="asrEdit" hidden>
    <div class="asr-label">我听到的是（可以修改后再发送）</div>
    <textarea id="asrText" rows="2"></textarea>
    <div class="asr-actions">
      <button class="btn ghost" id="btnAsrCancel">取消</button>
      <button class="btn" id="btnAsrSend">发送</button>
    </div>
  </div>

  <!-- 照片预览 -->
  <div class="photo-preview" id="photoPreview" hidden>
    <img id="photoImg" alt="待发送的照片">
    <div class="photo-info">
      <div class="photo-name" id="photoName"></div>
      <div class="photo-size" id="photoSize"></div>
    </div>
    <div class="photo-actions">
      <button class="btn ghost small" id="btnPhotoReplace">替换</button>
      <button class="btn ghost small danger" id="btnPhotoDelete">删除</button>
    </div>
    <input type="text" id="photoQuestion" placeholder="想问我照片里的什么？（可以不填）">
  </div>

  <!-- 底部输入栏 -->
  <div class="attachment-menu" id="attachmentMenu" hidden>
    <button type="button" id="btnMenuPhoto">拍照 / 选择图片</button>
    <button type="button" id="btnMenuVoice">语音提问</button>
    <button type="button" id="btnMenuNew">开始新对话</button>
  </div>
  <footer class="inputbar" id="inputbar">
    <button class="icon-btn round" id="btnPhoto" title="拍照或选择照片" aria-label="拍照或选择照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l1.5-2h5L16 5h3a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/><circle cx="12" cy="12" r="4"/></svg></button>
    <div class="text-wrap">
      <input type="text" id="textInput" aria-label="消息" placeholder="发消息或点右侧说话…" autocomplete="off" enterkeyhint="send">
    </div>
    <button class="mode-toggle" id="btnModeToggle" aria-label="按住说话，松开结束">按住说话<span id="modeIcon" hidden></span><span id="modeLabel" hidden></span></button>
    <button class="icon-btn round" id="btnMore" aria-label="更多功能" aria-expanded="false" aria-controls="attachmentMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></button>
    <button class="send-btn" id="btnSend" aria-label="发送" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6l6-6 6 6"/></svg></button>
    <button class="send-btn stop" id="btnStop" hidden aria-label="停止生成">停止</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <input type="file" id="audioFileInput" accept="audio/*" capture="user" hidden>
  </footer>

  <!-- 录音浮层 -->
  <div class="rec-layer" id="recLayer" hidden>
    <div class="rec-card">
      <div class="rec-wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="rec-title">正在听你说…</div>
      <div class="rec-tip">松开结束录音，文字会在识别后校正</div>
      <div id="recTranscript" aria-live="polite">正在听，请开始说话…</div>
      <button class="btn danger big" id="btnRecStop">停止录音</button>
      <button class="btn ghost" id="btnRecCancel">取消发送</button>
    </div>
  </div>

</div>
<script src="/static/live-transcription.js?v=20261015hold1"></script>
<script src="/static/hold-to-talk.js?v=20261015touch3"></script>
<script src="/static/speech-envelope.js?v=20261025p0fix1"></script>
<script src="/static/app.js?v=20261025p0fix1"></script>
<script src="/static/2d-character.js?v=20261025p0fix1"></script>
<script src="/static/companion.js?v=20261025illustrated1"></script>
</body>
</html>
