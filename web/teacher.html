<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小隐 · 教师端</title>
<style>
:root{--f9:#1d3b28;--f7:#2f6b3f;--f5:#4a8f56;--leaf:#d7e9cf;--cream:#fbf7ec;--cream2:#f5efdd;--sun:#f2c14e;--clay:#c8552f;--ink:#1c2a1e;--soft:#4a5c4d;--white:#fff;--shadow:0 6px 20px rgba(29,59,40,.12);}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;height:100%;}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#f4f9ef,var(--cream2));color:var(--ink);font-size:15px;}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:linear-gradient(180deg,#fff,#f0f7ec);border-bottom:1px solid var(--leaf);}
header h1{font-size:18px;margin:0;color:var(--f9);}
header .sub{font-size:12.5px;color:var(--soft);}
.wrap{max-width:1100px;margin:0 auto;padding:16px 18px;display:grid;grid-template-columns:300px 1fr;gap:16px;}
.card{background:var(--white);border:1px solid var(--leaf);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
.card h2{font-size:15px;margin:0 0 10px;color:var(--f7);}
label{display:block;font-size:13px;font-weight:700;color:var(--f7);margin:8px 0 4px;}
select,input,textarea{width:100%;border:1.5px solid var(--leaf);border-radius:9px;padding:8px 10px;font-size:14px;font-family:inherit;background:var(--cream);}
textarea{resize:vertical;min-height:90px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:none;border-radius:9px;background:var(--f7);color:#fff;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ghost{background:var(--cream);color:var(--f7);border:1.5px solid var(--leaf);}
.btn.big{padding:11px;font-size:15px;}
.chat{height:520px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--cream);border-radius:10px;border:1px solid var(--leaf);}
.m{max-width:82%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;}
.m.a{background:#fff;border:1px solid var(--leaf);align-self:flex-start;}
.m.u{background:var(--f7);color:#fff;align-self:flex-end;}
.m.meta{align-self:center;background:transparent;color:var(--soft);font-size:12.5px;box-shadow:none;}
.m.err{background:#fdeae4;border:1px solid #f3c3b4;color:#8a2c1a;}
.cap{display:flex;flex-direction:column;gap:8px;font-size:13px;}
.cap-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;background:var(--cream);}
.cap-item .k{font-weight:700;color:var(--f9);}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;}
.badge.on{background:#d9f0d2;color:#2f6b3f;}
.badge.off{background:#f0e6d8;color:#8a6a3a;}
.badge.demo{background:#ffe9b0;color:#8a5a00;}
.qr{display:flex;flex-direction:column;gap:8px;align-items:center;}
.qr img{width:220px;height:220px;}
.qr .url{font-size:12.5px;color:var(--soft);word-break:break-all;text-align:center;}
.bottom{display:flex;gap:8px;margin-top:8px;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;}.chat{height:360px;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>小隐 · 教师端控制台</h1>
    <div class="sub">《解锁大自然的隐身魔法》课程智能体</div>
  </div>
  <div class="row">
    <button class="btn ghost" id="scanBtn">打开扫码页</button>
    <button class="btn ghost" id="studentBtn">打开学生端</button>
  </div>
</header>
<div class="wrap">
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="card">
      <h2>教学环节</h2>
      <label>当前环节</label>
      <select id="stageSel">
        <option value="">通用（不限环节）</option>
        <option value="s1">环节一 · 情境导入</option>
        <option value="s2">环节二 · 观察发现</option>
        <option value="s3">环节三 · 闯关探究</option>
        <option value="s4">环节四 · 分享收获</option>
        <option value="s5">环节五 · 拓展延伸</option>
      </select>
      <label>教学模式</label>
      <select id="modeSel">
        <option value="normal">常规课堂</option>
        <option value="tablet">平板探究</option>
        <option value="share">分享交流</option>
      </select>
      <label>系统提示（可选，附加指令）</label>
      <textarea id="sysExtra" placeholder="如：多用比喻；少讲术语……"></textarea>
    </div>
    <div class="card">
      <h2>能力状态</h2>
      <div class="cap" id="capList"><div class="cap-item">加载中…</div></div>
    </div>
    <div class="card qr">
      <h2 style="align-self:flex-start">课堂二维码</h2>
      <img id="qrImg" alt="二维码" class="" src="/api/qrcode.png?type=scan">
      <div class="url" id="qrUrl"></div>
      <div class="row" style="justify-content:center;">
        <button class="btn ghost" id="checkBtn">网络自检</button>
      </div>
      <div class="cap" id="checkResult"></div>
    </div>
  </div>
  <div class="card">
    <h2>教师对话（可实时预览学生端体验）</h2>
    <div class="chat" id="chat"></div>
    <div class="bottom">
      <textarea id="input" placeholder="输入学生可能问的问题，回车发送（Shift+回车换行）"></textarea>
    </div>
    <div class="row" style="margin-top:8px;justify-content:space-between;">
      <button class="btn ghost" id="clearBtn">清空</button>
      <button class="btn big" id="sendBtn">发送</button>
    </div>
  </div>
</div>
<script>
function $(id){return document.getElementById(id);}
var sid='teacher-'+Math.random().toString(36).slice(2,10);
var es=null;
function line(t){var d=document.createElement('div');d.className='m meta';d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;}
function msg(role,text){var d=document.createElement('div');d.className='m '+role;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d;}

function ensureSSE(){return new Promise(function(resolve){if(es){return resolve(es);} es=new EventSource('/api/stream?sid='+encodeURIComponent(sid));
  es.addEventListener('meta',function(e){try{var d=JSON.parse(e.data);if(d.demo)line('演示模式（非真实 AI）');}catch(_){}});
  es.addEventListener('delta',function(e){if(!cur){cur=msg('a','');}cur.textContent+=e.data;$('chat').scrollTop=1e9;});
  es.addEventListener('done',function(e){cur=null;try{var d=JSON.parse(e.data);line('轮次 '+d.round+' · '+(d.is_real_ai?'真实 AI':'演示内容')+' · 会话 '+d.context_count);}catch(_){}});
  es.addEventListener('error',function(e){var d=document.createElement('div');d.className='m err';d.textContent='连接错误，请重试';$('chat').appendChild(d);cur=null;});
  es.onopen=function(){resolve(es);};
});}
var cur=null;

function send(){var t=$('input').value.trim();if(!t){return;}msg('u',t);$('input').value='';
  var body=new URLSearchParams({sid:sid,text:t,stage:$('stageSel').value,mode:$('modeSel').value,sys_extra:$('sysExtra').value});
  fetch('/api/chat',{method:'POST',body:body}).then(function(r){return r.json().then(function(j){if(!r.ok){var d=document.createElement('div');d.className='m err';d.textContent='错误：'+(j.error||r.status);$('chat').appendChild(d);}});}).catch(function(e){var d=document.createElement('div');d.className='m err';d.textContent='网络错误：'+e;$('chat').appendChild(d);});
  ensureSSE();}

$('sendBtn').onclick=send;
$('input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('clearBtn').onclick=function(){fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:sid})}).then(function(){$('chat').innerHTML='';line('已清空会话');});};

function loadCap(){fetch('/api/access-info').then(function(r){return r.json();}).then(function(d){
  var list=$('capList');list.innerHTML='';
  var items=[['主模型',d.llm],['图片识别',d.vision],['语音识别',d.asr],['语音合成',d.tts]];
  items.forEach(function(it){var name=it[0],c=it[1];var div=document.createElement('div');div.className='cap-item';
    var cls=c.configured?(c.enabled?'on':'off'):'off';var txt=c.configured?(c.enabled?'已配置':'未启用'):'未配置';
    if(c.demo){cls='demo';txt='演示模式';}
    div.innerHTML='<span class="k">'+name+'</span><span class="badge '+cls+'">'+txt+'</span>';list.appendChild(div);
    if(c.configured&&c.vendor){var m=document.createElement('div');m.style.cssText='font-size:12px;color:var(--soft);grid-column:1/-1;padding:0 10px;';m.textContent='供应商：'+c.vendor+' · '+(c.model||'');list.appendChild(m);}
  });
  // QR URL
  if(d.scan_url){$('qrUrl').textContent=d.scan_url;}
}).catch(function(){$('capList').innerHTML='<div class="cap-item">无法加载</div>';});}

$('checkBtn').onclick=function(){$('checkResult').innerHTML='';fetch('/api/network-check').then(function(r){return r.json();}).then(function(d){
  (d.results||[]).forEach(function(r){var div=document.createElement('div');div.className='cap-item';div.innerHTML='<span class="k">'+r.label+'</span><span class="badge '+(r.reachable?'on':'off')+'">'+(r.reachable?('可达 '+r.status):'不可达')+'</span>';$('checkResult').appendChild(div);});
}).catch(function(){$('checkResult').innerHTML='<div class="cap-item">自检失败</div>';});};

$('scanBtn').onclick=function(){window.open('/scan','_blank');};
$('studentBtn').onclick=function(){window.open('/','_blank');};

loadCap();ensureSSE().then(function(){line('教师端已连接，可开始对话');});
</script>
</body>
</html>
